services:
  # Our PostgreSQL db
  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_DB: blogdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

  # DB management interface
  adminer:
    image: adminer:latest
    restart: always
    ports:
      - "8888:8080"
